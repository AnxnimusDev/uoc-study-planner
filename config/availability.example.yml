# Disponibilidad semanal del alumno. Copia a config/availability.yml (está en .gitignore) y ajústalo.
# En la fase 3 este fichero lo genera el cuestionario de la UI.

timezone: Europe/Madrid

work:
  # remote | office, por día de la semana
  days:
    MONDAY:    { mode: remote, start: "09:00", end: "18:00" }
    TUESDAY:   { mode: remote, start: "09:00", end: "18:00" }
    WEDNESDAY: { mode: remote, start: "09:00", end: "18:00" }
    THURSDAY:  { mode: remote, start: "09:00", end: "18:00" }
    FRIDAY:    { mode: remote, start: "08:00", end: "15:00" }
  lunch: { start: "14:00", end: "15:00" }

commute:
  # Solo se aplica en días de oficina (mode: office o override OFFICE_DAY)
  minutesEachWay: 45
  canStudyDuringCommute: false

sleep:
  wakeUp: "07:30"
  bedtime: "23:30"

fixedActivities:
  - { label: "Gimnasio", days: [MONDAY, WEDNESDAY], start: "19:00", end: "20:30" }
  - { label: "Cena",     days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY], start: "21:00", end: "22:00" }

studyPreferences:
  preferredSlots:
    - { days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY], start: "18:15", end: "21:00" }
    - { days: [SATURDAY, SUNDAY], start: "10:00", end: "13:30" }
  minSessionMinutes: 30
  maxSessionMinutes: 120
  maxDailyHours: 3
  noStudyDays: []

deadlines:
  defaultMarginDays: 1
  perCourse:
    # "05.557": 2   # código de asignatura → días de margen
